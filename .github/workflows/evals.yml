name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  design-system-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Run golden evals
        run: python evals/run_evals.py

      - name: Upload last_run.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-last-run
          path: evals/last_run.json
          if-no-files-found: warn
